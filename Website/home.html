<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Akhil Balu</title>

<style>

/* ---------- GLOBAL ---------- */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:#050505;
  color:white;
}

/* ---------- GRID BACKGROUND ---------- */

.grid-bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(rgba(0,255,200,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,200,.08) 1px, transparent 1px);
  background-size:40px 40px;
  animation:gridMove 20s linear infinite;
}

@keyframes gridMove{
  from{transform:translateY(0)}
  to{transform:translateY(40px)}
}

/* ---------- FLOATING BUBBLES ---------- */

.bubbles span{
  position:absolute;
  bottom:-120px;
  width:20px;
  height:20px;
  background:rgba(0,255,200,.25);
  border-radius:50%;
  animation:rise linear infinite;
  box-shadow:0 0 15px rgba(0,255,200,.7);
}

@keyframes rise{
  0%{transform:translateY(0) scale(.5); opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-110vh) scale(1.3); opacity:0;}
}

.bubbles span:nth-child(odd){ animation-duration:10s; }
.bubbles span:nth-child(even){ animation-duration:14s; }

/* ---------- CENTER CONTENT ---------- */

.center{
  position:relative;
  z-index:10;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.title{
  font-size:clamp(2.5rem,6vw,5rem);
  font-weight:900;
  letter-spacing:2px;
  color:#00ffd0;
  text-shadow:
    0 0 10px rgba(0,255,200,.8),
    0 0 25px rgba(0,255,200,.6);
  animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
  50%{opacity:.7}
}

.subtitle{
  margin-top:15px;
  font-size:1.2rem;
  color:#bbb;
  min-height:24px;
}

/* ---------- BUTTON ---------- */

.enter-btn{
  margin-top:40px;
  padding:14px 40px;
  font-size:1rem;
  font-weight:700;
  border:none;
  border-radius:40px;
  cursor:pointer;
  color:black;
  background:linear-gradient(90deg,#00ffd0,#00c9ff);
  transition:.35s ease;
  box-shadow:0 0 25px rgba(0,255,200,.7);
  letter-spacing:1px;
}

.enter-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 60px rgba(0,255,200,1);
}

/* ---------- FADE OUT ---------- */

.fade-out{
  animation:fadeOut .8s forwards;
}

@keyframes fadeOut{
  to{opacity:0; transform:scale(1.05)}
}

</style>
</head>

<body>

<div class="grid-bg"></div>

<div class="bubbles">
  <span style="left:5%"></span>
  <span style="left:15%"></span>
  <span style="left:25%"></span>
  <span style="left:35%"></span>
  <span style="left:45%"></span>
  <span style="left:55%"></span>
  <span style="left:65%"></span>
  <span style="left:75%"></span>
  <span style="left:85%"></span>
  <span style="left:95%"></span>
</div>

<div class="center" id="landing">

  <h1 class="title">Akhil Balu</h1>

  <!-- Typing subtitle -->
  <p class="subtitle">
    <span id="typing"></span>
  </p>

  <button class="enter-btn" onclick="enterSite()">
    Enter Portfolio
  </button>

</div>

<script>

/* ---------- TYPING EFFECT ---------- */

const text = ".NET Developer | Software Developer";
let index = 0;

function typeEffect() {
  if (index < text.length) {
    document.getElementById("typing").textContent += text.charAt(index);
    index++;
    setTimeout(typeEffect, 60);
  }
}

window.onload = typeEffect;

/* ---------- ENTER SITE ---------- */

function enterSite(){
  const landing = document.getElementById("landing");
  landing.classList.add("fade-out");

  setTimeout(()=>{
    window.location.href = "index.html";
  },700);
}

</script>

</body>
</html>
